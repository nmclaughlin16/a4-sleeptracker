<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title style="text-align:center; font-size:2.5rem; font-family:Georgia, 'Times New Roman', Times, serif">
      Sleep Tracker
    </ion-title>

        <!-- logbook button for navigating to the logbook page -->
    <ion-buttons slot="end">
      <ion-button routerLink="/logbook">
        <ion-icon slot="icon-only" name="book"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <!-- placeholder for weekly graph -->
  <p>sleep graph here</p>
</ion-content>
